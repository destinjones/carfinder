<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CarFinder social card (rendered to brand/social/og-1200x630.png by brand/tools/shots.py)</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#04060a;color:#e6edf3;font-family:"Barlow",system-ui,sans-serif}
  .card{position:relative;width:1200px;height:630px;background:
      radial-gradient(760px 420px at 85% 10%,rgba(127,168,255,.22),transparent 70%),
      radial-gradient(600px 400px at 0% 100%,rgba(102,211,156,.14),transparent 70%),#04060a}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
  .text{position:absolute;left:72px;top:76px;width:660px}
  .eyebrow{font:500 15px/1 "IBM Plex Mono",monospace;letter-spacing:.24em;text-transform:uppercase;color:#7fa8ff;display:flex;align-items:center;gap:14px}
  .eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
  h1{font:900 84px/.92 "Big Shoulders Display","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:26px 0 0}
  h1 span{color:#7fa8ff}
  p{font:500 22px/1.35 "Barlow",sans-serif;color:#b7c2cf;margin:26px 0 0;max-width:600px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
  .chips span{font:500 14px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#e6edf3;border:1px solid #26343f;padding:11px 14px;border-radius:999px;background:rgba(8,12,18,.7)}
  .phone{position:absolute;right:74px;top:62px;width:300px;height:620px;border-radius:40px;background:#0f1317;border:3px solid #26343f;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #090d12;overflow:hidden;transform:rotate(-6deg)}
  .phone img{width:100%;display:block}
  .emblem{position:absolute;left:72px;bottom:56px;display:flex;align-items:center;gap:14px;font:700 20px/1 "Big Shoulders Display",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8b9bab}
  .emblem img{width:34px;height:34px}
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="text">
    <div class="eyebrow">Free · open source · 11 countries</div>
    <h1>Every new car.<br><span>What it really costs.</span></h1>
    <p>List price, what dealers actually charge, and the drive-off price for your state, with taxes and fees in.</p>
    <div class="chips"><span>2,729 vehicles</span><span>USA · India · China · UK · more</span><span>Phone-first</span></div>
  </div>
  <div class="phone"><img src="../shots/phone-us-light.webp" alt=""></div>
  <div class="emblem"><img src="../emblem/emblem-256.png" alt="">CarFinder 2026 · destinjones.github.io/carfinder</div>
</div>
</body>
</html>
